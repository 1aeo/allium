name: Allium CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  code-quality:
    name: "Code Quality & Linting"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-linting-${{ hashFiles('**/config/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-linting-
          
    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        
    - name: Lint Python code
      run: |
        # Check for critical syntax errors only
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Critical linting issues found"
        # Non-blocking style checks
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || echo "⚠️ Style issues found"

  unit-tests:
    name: "Unit Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-tests-${{ hashFiles('**/config/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-tests-
          
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r config/requirements-dev.txt
        
    - name: Run unit tests
      run: |
        # Run tests if they exist, otherwise skip gracefully
        if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
          # Run tests excluding slow tests (e.g., integration tests, timeout tests)
          # Use pytest.ini configuration which sets timeout and markers
          python -m pytest tests/ -v --cov=. --cov-report=xml -m "not slow"
        else
          echo "⚠️ No tests found, creating minimal coverage report"
          echo '<?xml version="1.0" ?><coverage version="6.0"><sources></sources><packages></packages></coverage>' > coverage.xml
        fi
        
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  template-validation:
    name: "Template Syntax Validation"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install template dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jinja2
        
    - name: Validate Jinja2 templates
      run: |
        # Check if templates directory exists
        if [ ! -d "allium/templates" ]; then
          echo "⚠️ Templates directory not found, skipping validation"
          exit 0
        fi
        
        # Check template syntax
        find allium/templates/ -name "*.html" -exec python -c "
        from jinja2 import Environment, FileSystemLoader, TemplateSyntaxError
        import sys
        import os
        try:
            template_path = '{}'
            # Extract relative path from allium/templates/
            relative_path = os.path.relpath(template_path, 'allium/templates')
            
            env = Environment(loader=FileSystemLoader('allium/templates'))
            env.get_template(relative_path)
            print('✅ Template {} is valid'.format(relative_path))
        except TemplateSyntaxError as e:
            print('❌ Template {} has syntax error: {}'.format(relative_path, e))
            sys.exit(1)
        except Exception as e:
            print('⚠️  Could not validate {}: {}'.format(relative_path, e))
        " \; || echo "⚠️ Template validation completed with warnings"

  security-scan:
    name: "Security Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install -r config/requirements-dev.txt
        
    - name: Run security scans
      run: |
        # Check for common security issues
        bandit -r . -f json -o bandit-report.json || true
        # Check for known vulnerabilities in dependencies
        safety check --json --output safety-report.json || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  integration-tests:
    name: "Module Integration Tests"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r config/requirements-dev.txt
        
    - name: Test AROI leaderboard generation
      run: |
        # Test the leaderboard generation process
        cd allium
        python -c "
        import sys
        sys.path.insert(0, 'lib')
        try:
            import aroileaders
            print('✅ AROI leaders module imports successfully')
        except ImportError as e:
            print('❌ Cannot import aroileaders:', e)
            # This is not a critical failure for CI, just informational
            print('ℹ️  Module import failed, but this is expected in CI environment')
        "
        
  setup-script-validation:
    name: "Setup Script End-to-End Test"
    runs-on: ubuntu-latest
    env:
      CI: true
      GITHUB_ACTIONS: true
      # Opt-in for this job only. Production builds do not set it, so they
      # still hit Onionoo and never use the committed details fixture.
      ALLIUM_CI_DETAILS_FALLBACK: "1"
      ALLIUM_CI_DETAILS_FIXTURE: /tmp/allium-setup-test/ci-onionoo-details.json
      ALLIUM_CI_ONIONOO_LIB: /tmp/allium-setup-test/ci_onionoo_details.sh
    strategy:
      matrix:
        python-version: ["3.8", "3.13"]  # Test on minimum and latest supported versions
    
    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Test fresh environment setup
      run: |
        # Create a temporary directory to simulate fresh environment
        mkdir -p /tmp/allium-setup-test
        cd /tmp/allium-setup-test
        
        echo "🧪 Testing setup.sh in fresh environment (Python ${{ matrix.python-version }})"
        echo "🤖 CI environment: CI=$CI, GITHUB_ACTIONS=$GITHUB_ACTIONS"
        
        # Download and run setup script with retry logic
        for download_attempt in 1 2 3; do
          echo "📥 Download attempt $download_attempt of 3..."
          if curl -sSL --connect-timeout 30 --max-time 60 https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/setup.sh -o setup.sh; then
            echo "✅ Setup script downloaded successfully"
            break
          else
            echo "⚠️  Download attempt $download_attempt failed"
            if [ $download_attempt -eq 3 ]; then
              echo "❌ Failed to download setup script after 3 attempts"
              exit 1
            fi
            sleep 10
          fi
        done
        
        # Verify we downloaded a shell script, not an error page
        if ! head -1 setup.sh | grep -q '^#!/bin/bash'; then
          echo "❌ Downloaded file is not a valid shell script"
          echo "First line: $(head -1 setup.sh)"
          exit 1
        fi
        
        # Make sure the script is executable
        chmod +x setup.sh

        # Fixture and helper come from this commit. setup.sh then clones the
        # default branch; the env vars point at these downloads so the seed
        # works before the fixture is on the default branch.
        echo "📥 Downloading CI Onionoo details fixture and helper..."
        curl -fsSL --connect-timeout 30 --max-time 60 \
          "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tests/fixtures/ci/onionoo_details.json" \
          -o "$ALLIUM_CI_DETAILS_FIXTURE"
        curl -fsSL --connect-timeout 30 --max-time 60 \
          "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci_onionoo_details.sh" \
          -o "$ALLIUM_CI_ONIONOO_LIB"
        python3 -c 'import json,os; d=json.load(open(os.environ["ALLIUM_CI_DETAILS_FIXTURE"])); assert d.get("relays") and d.get("relays_published")'
        grep -q 'seed_ci_onionoo_details_cache' "$ALLIUM_CI_ONIONOO_LIB"

        # 900s is only a hang backstop around clone, pip, and generation.
        # The details fetch is bounded by the fresh-cache timeout: setup.sh
        # seeds allium/data/cache/onionoo_details.json, and workers.py returns
        # that cache when the live request exceeds the budget (~90s, no retries).
        # Do not raise this backstop to paper over a slow Onionoo.
        timeout 900 bash setup.sh
        setup_exit_code=$?

        if [ $setup_exit_code -eq 0 ]; then
          echo "✅ Setup script completed successfully"
        elif [ $setup_exit_code -eq 124 ]; then
          echo "❌ Setup script hit the 15 minute hang backstop"
          echo "   A slow Onionoo should have fallen back to the CI details cache before this."
          exit 1
        else
          echo "❌ Setup script exited with code $setup_exit_code"
          exit 1
        fi
        
    - name: Validate setup results
      run: |
        cd /tmp/allium-setup-test/allium
        
        echo "🔍 Validating setup results..."
        echo "📁 Current directory: $(pwd)"
        echo "📋 Contents:"
        ls -la
        
        # Activate the virtual environment
        test -d venv || { echo "❌ venv was not created"; exit 1; }
        source venv/bin/activate
        
        # Check that key files exist in the correct subdirectory
        test -f "allium/allium.py" || { echo "❌ allium/allium.py not found"; ls -la allium/; exit 1; }
        test -f "config/requirements.txt" || { echo "❌ config/requirements.txt not found"; exit 1; }
        test -f "www/index.html" || { echo "❌ www/index.html was not generated"; ls -la www/ || true; exit 1; }
        grep -q '<html' www/index.html || { echo "❌ www/index.html is not HTML"; exit 1; }
        echo "✅ index.html generated"
        
        # Check that Python can import required modules
        python3 -c "import jinja2; print('✅ Jinja2 import successful')" || {
          echo "❌ Jinja2 not properly installed"
          pip list | grep -i jinja || echo "Jinja2 not found in pip list"
          exit 1
        }
        
        echo "✅ Setup script validation completed successfully"
        
    - name: Test regeneration
      run: |
        cd /tmp/allium-setup-test/allium
        
        # Activate the virtual environment
        source venv/bin/activate
        
        # Make sure we're in the right directory with the allium.py script
        cd allium
        # shellcheck disable=SC1090
        source "$ALLIUM_CI_ONIONOO_LIB"
        
        echo "🔄 Testing data regeneration..."
        echo "📁 Current directory: $(pwd)"
        echo "📋 Files in current directory:"
        ls -la
        
        # One live attempt. The details cache from setup is fresh, so a slow
        # Onionoo falls back inside allium (fresh-cache budget) instead of
        # retrying for several minutes. Exit 0 with no index.html means the
        # API returned nothing; a non-zero exit is a real failure.
        regeneration_ok=false
        if timeout 300 python3 allium.py --progress --apis details --out ../test-www; then
          exit_code=0
        else
          exit_code=$?
        fi
        outcome=$(ci_live_generation_outcome "$exit_code" ../test-www/index.html)
        if [ "$outcome" = "ok" ]; then
          echo "✅ Regeneration test completed from the live details request or its cache"
          regeneration_ok=true
        elif [ "$outcome" = "fallback" ]; then
          echo "⚠️  Regeneration exited 0 without index.html; using the CI details fixture"
          if generate_from_ci_onionoo_fixture ../test-www allium.py && site_index_ready ../test-www/index.html; then
            regeneration_ok=true
          fi
        else
          echo "❌ Regeneration failed with exit code $exit_code"
          echo "   Working directory: $(pwd)"
          echo "   Python version: $(python3 --version)"
        fi
        
        if [ "$regeneration_ok" != true ]; then
          echo "❌ Regeneration did not produce test-www/index.html"
          exit 1
        fi
        echo "✅ Regeneration test passed"
        test -f ../test-www/index.html
        
  template-security-audit:
    name: "Template Security & Quality Audit"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install template tools
      run: |
        pip install jinja2 djlint
        
    - name: Check template quality
      run: |
        # Check for template best practices
        echo "🔍 Checking for template security issues..."
        
        # Check for unsafe filters
        if grep -r "| safe" allium/templates/ 2>/dev/null; then
          echo "⚠️  Found '| safe' filters - review for XSS risks"
        else
          echo "✅ No unsafe filters found"
        fi
        
        # Check autoescape configuration
        if grep -r "autoescape.*false" allium/templates/ 2>/dev/null; then
          echo "❌ Found disabled autoescape - security risk!"
          exit 1
        else
          echo "✅ Autoescape properly configured"
        fi
        
        # Lint HTML/Jinja2 templates
        djlint allium/templates/ --check --quiet || echo "⚠️  Template formatting issues found"
        
  performance-benchmarks:
    name: "Performance Benchmarks & Memory Profiling"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install -r config/requirements-dev.txt
        
    - name: Performance test
      run: |
        # Test template rendering performance
        cd allium
        python -c "
        import time
        import tracemalloc
        import sys
        
        sys.path.insert(0, 'lib')
        
        tracemalloc.start()
        start_time = time.time()
        
        try:
            # Test basic Python imports and operations
            print('⏱️  Starting performance test...')
            
            # Import Jinja2 and test template loading
            from jinja2 import Environment, FileSystemLoader
            env = Environment(loader=FileSystemLoader('templates'))
            
            # Test template loading performance
            template_files = ['index.html', 'skeleton.html']
            for template_file in template_files:
                try:
                    template = env.get_template(template_file)
                    print(f'✅ Successfully loaded template: {template_file}')
                except Exception as e:
                    print(f'⚠️  Could not load template {template_file}: {e}')
            
            end_time = time.time()
            current, peak = tracemalloc.get_traced_memory()
            tracemalloc.stop()
            
            print(f'⏰ Execution time: {end_time - start_time:.2f} seconds')
            print(f'💾 Memory usage: {current / 1024 / 1024:.1f} MB')
            print(f'💾 Peak memory: {peak / 1024 / 1024:.1f} MB')
            
            # Alert if performance degrades significantly  
            if end_time - start_time > 10:
                print('⚠️  Template loading took longer than expected')
            if peak / 1024 / 1024 > 100:
                print('⚠️  Memory usage higher than expected')
            
            print('✅ Performance test completed successfully')
                
        except Exception as e:
            print(f'❌ Performance test failed: {e}')
            print('ℹ️  This is not a critical failure for CI')
        " 